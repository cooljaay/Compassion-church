name: CJGM Automated CI Quality & Integrity Scanner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    name: Scan Every Nook & Cranny for PR Errors
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔍 3. Execute Nook & Crannies Integrity Scanner
        run: node .github/scripts/test-integrity.js

      - name: 🌐 4. Validate HTML & Links Syntax
        run: |
          npx -y htmlhint index.html

      - name: 🎨 5. Audit CSS Stylesheet Syntax
        run: |
          npx -y stylelint "styles.css" --allow-empty-input || true

      - name: ⚡ 6. Verify Fastly CDN Audio Sermon Endpoint Availability
        run: |
          curl -I -s "https://github.com/cooljaay/Compassion-church/releases/download/v1.0.0/Healing.as.a.blessing.from.God.Pastor.Dolapo.mp3" | head -n 1
